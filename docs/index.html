<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiNANCiEオーナーチャレンジ フォロワーランキング</title>
  
  <!-- OGP -->
  <meta property="og:title" content="FiNANCiEオーナーチャレンジ フォロワーランキング">
  <meta property="og:description" content="FiNANCiEオーナーチャレンジ参加者のフォロワー数・週間投稿数ランキング">
  <meta property="og:image" content="https://financie-oc.pages.dev/IMG_4141.jpeg">

  <meta property="og:site_name" content="FiNANCiEオーナーチャレンジ">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FiNANCiEオーナーチャレンジ フォロワーランキング">
  <meta name="twitter:description" content="FiNANCiEオーナーチャレンジ参加者のフォロワー数・週間投稿数ランキング">

  <!-- その他メタ -->
  <meta name="description" content="FiNANCiEオーナーチャレンジ参加者のフォロワー数・週間投稿数ランキング">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00d4ff, #7b2fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.4;
    }
    
    .updated {
      color: #888;
      font-size: 0.9rem;
    }
    
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      overflow: hidden;
    }
    
    .ranking-table th,
    .ranking-table td {
      padding: 12px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .ranking-table th {
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
      font-size: 0.8rem;
      color: #aaa;
    }
    
    .ranking-table tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .header-group th {
      text-align: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }
    
    .header-sub th {
      font-size: 0.75rem;
      padding: 8px 6px;
      text-align: center;
    }
    
    .group-financie {
      background: rgba(0, 212, 255, 0.15) !important;
      color: #00d4ff !important;
    }
    
    .group-x {
      background: rgba(120, 120, 120, 0.15) !important;
      color: #aaa !important;
    }
    
    .rank {
      font-weight: bold;
      font-size: 1.2rem;
      width: 40px;
    }
    
    .rank-1 { color: #ffd700; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    
    .name-cell {
      min-width: 160px;
    }
    
    .community-name {
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .links a {
      font-size: 0.7rem;
      padding: 5px 12px;
      border-radius: 4px;
      text-decoration: none;
      transition: opacity 0.2s;
      cursor: pointer;
    }
    
    .links a:hover {
      opacity: 0.8;
    }
    
    .link-financie {
      background: #00d4ff;
      color: #000;
    }
    
    .link-x {
      background: #333;
      color: #fff;
    }
    
    .link-chart {
      background: #7b2fff;
      color: #fff;
    }
    
    .followers {
      color: #00d4ff;
      font-weight: bold;
      text-align: center;
    }
    
    .weekly {
      color: #7b2fff;
      text-align: center;
    }
    
    .x-data {
      color: #aaa;
      font-size: 0.85rem;
      text-align: center;
    }
    
    .x-avg {
      font-size: 0.7rem;
      color: #4ade80;
    }
    
    .x-avg.negative {
      color: #f87171;
    }
    
    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .modal-title {
      font-size: 1.3rem;
      font-weight: bold;
    }
    
    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    
    .modal-close:hover {
      opacity: 0.7;
    }
    
    .chart-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .chart-tab {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
    }
    
    .chart-tab:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .chart-tab.active {
      background: #00d4ff;
      color: #000;
    }
    
    .chart-tab.x-tab.active {
      background: #333;
      color: #fff;
    }
    
    .period-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .period-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .period-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .period-btn.active {
      background: #7b2fff;
    }
    
    .chart-container {
      position: relative;
      height: 300px;
    }
    
    .stats-summary {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    
    .stat-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 8px;
      flex: 1;
      min-width: 120px;
    }
    
    .stat-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
    }
    
    .stat-value.positive {
      color: #4ade80;
    }
    
    .stat-value.negative {
      color: #f87171;
    }
    
    .no-data {
      text-align: center;
      color: #888;
      padding: 40px;
    }
    
    @media (max-width: 768px) {
      .ranking-table th,
      .ranking-table td {
        padding: 8px 4px;
        font-size: 0.7rem;
      }
      
      h1 {
        font-size: 1.3rem;
      }
      
      .links {
        gap: 6px;
      }
      
      .links a {
        font-size: 0.65rem;
        padding: 4px 8px;
      }
      
      .modal {
        padding: 16px;
      }
      
      .x-data {
        font-size: 0.7rem;
      }
      
      .x-avg {
        font-size: 0.6rem;
      }
      
      .header-sub th {
        font-size: 0.65rem;
        padding: 6px 3px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏆 FiNANCiEオーナーチャレンジ<br>フォロワーランキング</h1>
      <p class="updated">最終更新: <span id="lastUpdated">-</span></p>
    </header>
    
    <table class="ranking-table">
      <thead>
        <tr class="header-group">
          <th rowspan="2">順位</th>
          <th rowspan="2">コミュニティ</th>
          <th colspan="2" class="group-financie">FiNANCiE</th>
          <th colspan="2" class="group-x">𝕏</th>
        </tr>
        <tr class="header-sub">
          <th class="group-financie">フォロワー</th>
          <th class="group-financie">週間投稿</th>
          <th class="group-x">フォロワー</th>
          <th class="group-x">投稿数</th>
        </tr>
      </thead>
      <tbody id="rankingBody">
        <tr><td colspan="6" style="text-align:center;">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
  
  <!-- モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">推移</span>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      
      <div class="chart-tabs">
        <button class="chart-tab active" data-type="supporters">FiNANCiEフォロワー</button>
        <button class="chart-tab x-tab" data-type="xFollowers">Xフォロワー</button>
      </div>
      
      <div class="stats-summary" id="statsSummary"></div>
      
      <div class="period-buttons">
        <button class="period-btn active" data-period="1W">1W</button>
        <button class="period-btn" data-period="1M">1M</button>
        <button class="period-btn" data-period="1Y">1Y</button>
        <button class="period-btn" data-period="ALL">ALL</button>
      </div>
      <div class="chart-container">
        <canvas id="mainChart"></canvas>
      </div>
      <div class="no-data" id="noData" style="display:none;">
        データがありません
      </div>
    </div>
  </div>
  
  <script>
    let rankingData = null;
    let currentChart = null;
    let currentName = null;
    let currentType = 'supporters';
    
    function hasXData(item) {
      return item.xTotalDays > 0;
    }
    
    async function loadRanking() {
      try {
        const response = await fetch('data/ranking.json');
        rankingData = await response.json();
        
        document.getElementById('lastUpdated').textContent = rankingData.updated || '-';
        
        const tbody = document.getElementById('rankingBody');
        tbody.innerHTML = rankingData.ranking.map((item, i) => {
          const financieLink = item.financieUrl 
            ? `<a href="${item.financieUrl}" target="_blank" class="link-financie">FiNANCiE</a>` 
            : '';
          const xLink = item.xId 
            ? `<a href="https://x.com/${item.xId.replace('@', '')}" target="_blank" class="link-x">𝕏</a>` 
            : '';
          const chartLink = `<a class="link-chart" onclick="openChart('${item.name.replace(/'/g, "\\'")}')">📈推移</a>`;
          
          const xDataExists = hasXData(item);
          
          let xFollowersAvgHtml = '';
          if (xDataExists && item.xAvgFollowersPerDay !== 0) {
            const sign = item.xAvgFollowersPerDay >= 0 ? '+' : '';
            const cssClass = item.xAvgFollowersPerDay >= 0 ? '' : 'negative';
            xFollowersAvgHtml = `<div class="x-avg ${cssClass}">${sign}${item.xAvgFollowersPerDay}/日</div>`;
          }
          
          let xPostsAvgHtml = '';
          if (xDataExists && item.xAvgPostsPerDay !== 0) {
            const sign = item.xAvgPostsPerDay >= 0 ? '+' : '';
            xPostsAvgHtml = `<div class="x-avg">${sign}${item.xAvgPostsPerDay}/日</div>`;
          }
          
          return `
            <tr>
              <td class="rank ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</td>
              <td class="name-cell">
                <div class="community-name">${item.name}</div>
                <div class="links">${financieLink}${xLink}${chartLink}</div>
              </td>
              <td class="followers">${item.supporters.toLocaleString()}</td>
              <td class="weekly">${item.weeklyPosts}</td>
              <td class="x-data">
                ${xDataExists ? item.xFollowers.toLocaleString() : '-'}
                ${xFollowersAvgHtml}
              </td>
              <td class="x-data">
                ${xDataExists ? item.xPosts.toLocaleString() : '-'}
                ${xPostsAvgHtml}
              </td>
            </tr>
          `;
        }).join('');
        
      } catch (error) {
        console.error('データの読み込みに失敗:', error);
        document.getElementById('rankingBody').innerHTML = 
          '<tr><td colspan="6" style="text-align:center;color:#ff6b6b;">データの読み込みに失敗しました</td></tr>';
      }
    }
    
    function openChart(name) {
      currentName = name;
      currentType = 'supporters';
      document.getElementById('modalTitle').textContent = name + ' - 推移';
      document.getElementById('modalOverlay').classList.add('active');
      
      document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector('.period-btn[data-period="1W"]').classList.add('active');
      
      document.querySelectorAll('.chart-tab').forEach(btn => btn.classList.remove('active'));
      document.querySelector('.chart-tab[data-type="supporters"]').classList.add('active');
      
      updateStatsSummary();
      renderChart('1W');
    }
    
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      if (currentChart) {
        currentChart.destroy();
        currentChart = null;
      }
    }
    
    function updateStatsSummary() {
      const item = rankingData.ranking.find(r => r.name === currentName);
      const summary = document.getElementById('statsSummary');
      
      if (currentType === 'supporters') {
        const history = rankingData.history[currentName] || [];
        const latest = history.length > 0 ? history[history.length - 1].supporters : item?.supporters || 0;
        const oldest = history.length > 1 ? history[0].supporters : latest;
        const diff = latest - oldest;
        const days = history.length > 1 ? history.length - 1 : 0;
        const avg = days > 0 ? (diff / days).toFixed(2) : 0;
        
        summary.innerHTML = `
          <div class="stat-box">
            <div class="stat-label">現在</div>
            <div class="stat-value">${latest.toLocaleString()}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">期間増減</div>
            <div class="stat-value ${diff >= 0 ? 'positive' : 'negative'}">${diff >= 0 ? '+' : ''}${diff.toLocaleString()}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">一日平均</div>
            <div class="stat-value ${avg >= 0 ? 'positive' : 'negative'}">${avg >= 0 ? '+' : ''}${avg}</div>
          </div>
        `;
      } else {
        const xHistory = rankingData.xHistory?.[currentName] || [];
        if (xHistory.length > 0) {
          const latest = xHistory[xHistory.length - 1];
          const oldest = xHistory[0];
          const diff = latest.followers - oldest.followers;
          const days = item?.xTotalDays || 0;
          const avg = item?.xAvgFollowersPerDay || 0;
          
          summary.innerHTML = `
            <div class="stat-box">
              <div class="stat-label">現在</div>
              <div class="stat-value">${latest.followers.toLocaleString()}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">期間増減</div>
              <div class="stat-value ${diff >= 0 ? 'positive' : 'negative'}">${diff >= 0 ? '+' : ''}${diff.toLocaleString()}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">一日平均 (${days}日間)</div>
              <div class="stat-value ${avg >= 0 ? 'positive' : 'negative'}">${avg >= 0 ? '+' : ''}${avg}</div>
            </div>
          `;
        } else {
          summary.innerHTML = '<div class="stat-box"><div class="stat-label">Xデータ未入力</div></div>';
        }
      }
    }
    
    function filterDataByPeriod(data, period) {
      if (!data || data.length === 0) return [];
      
      const now = new Date();
      let cutoff;
      
      switch (period) {
        case '1W':
          cutoff = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          break;
        case '1M':
          cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
          break;
        case '1Y':
          cutoff = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
          break;
        case 'ALL':
        default:
          return data;
      }
      
      return data.filter(d => new Date(d.date || d.updatedAt) >= cutoff);
    }
    
    function renderChart(period) {
      let data, valueKey, label, color;
      
      if (currentType === 'supporters') {
        data = rankingData.history[currentName] || [];
        valueKey = 'supporters';
        label = 'フォロワー数';
        color = '#00d4ff';
      } else {
        data = rankingData.xHistory?.[currentName] || [];
        valueKey = 'followers';
        label = 'Xフォロワー数';
        color = '#888';
      }
      
      const filteredData = filterDataByPeriod(data, period);
      
      const canvas = document.getElementById('mainChart');
      const noData = document.getElementById('noData');
      
      if (currentChart) {
        currentChart.destroy();
      }
      
      if (!filteredData || filteredData.length === 0) {
        canvas.style.display = 'none';
        noData.style.display = 'block';
        return;
      }
      
      canvas.style.display = 'block';
      noData.style.display = 'none';
      
      const labels = filteredData.map(d => {
        const dateStr = d.date || d.updatedAt;
        const date = new Date(dateStr);
        return `${date.getMonth() + 1}/${date.getDate()}`;
      });
      const values = filteredData.map(d => d[valueKey]);
      
      currentChart = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: values,
            borderColor: color,
            backgroundColor: color + '20',
            fill: true,
            tension: 0.3,
            pointRadius: filteredData.length > 30 ? 0 : 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.parsed.y.toLocaleString() + ' 人';
                }
              }
            }
          },
          scales: {
            x: {
              grid: {
                color: 'rgba(255, 255, 255, 0.1)'
              },
              ticks: {
                color: '#888',
                maxTicksLimit: 10
              }
            },
            y: {
              grid: {
                color: 'rgba(255, 255, 255, 0.1)'
              },
              ticks: {
                color: '#888',
                callback: function(value) {
                  return value.toLocaleString();
                }
              }
            }
          }
        }
      });
    }
    
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    
    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderChart(this.dataset.period);
      });
    });
    
    document.querySelectorAll('.chart-tab').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentType = this.dataset.type;
        updateStatsSummary();
        const activePeriod = document.querySelector('.period-btn.active').dataset.period;
        renderChart(activePeriod);
      });
    });
    
    loadRanking();
  </script>
</body>
</html>
