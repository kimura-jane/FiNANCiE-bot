<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiNANCiE オーナーランキング</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00d4ff, #7b2fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .updated {
      color: #888;
      font-size: 0.9rem;
    }
    
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      overflow: hidden;
    }
    
    .ranking-table th,
    .ranking-table td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .ranking-table th {
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
      font-size: 0.85rem;
      color: #aaa;
    }
    
    .ranking-table tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .rank {
      font-weight: bold;
      font-size: 1.2rem;
      width: 50px;
    }
    
    .rank-1 { color: #ffd700; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    
    .name-cell {
      min-width: 180px;
    }
    
    .community-name {
      font-weight: 600;
      margin-bottom: 6px;
    }
    
    .links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .links a {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      text-decoration: none;
      transition: opacity 0.2s;
      cursor: pointer;
    }
    
    .links a:hover {
      opacity: 0.8;
    }
    
    .link-financie {
      background: #00d4ff;
      color: #000;
    }
    
    .link-x {
      background: #333;
      color: #fff;
    }
    
    .link-chart {
      background: #7b2fff;
      color: #fff;
    }
    
    .supporters {
      color: #00d4ff;
      font-weight: bold;
    }
    
    .weekly {
      color: #7b2fff;
    }
    
    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .modal-title {
      font-size: 1.3rem;
      font-weight: bold;
    }
    
    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    
    .modal-close:hover {
      opacity: 0.7;
    }
    
    .period-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .period-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .period-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .period-btn.active {
      background: #7b2fff;
    }
    
    .chart-container {
      position: relative;
      height: 300px;
    }
    
    .no-data {
      text-align: center;
      color: #888;
      padding: 40px;
    }
    
    @media (max-width: 600px) {
      .ranking-table th,
      .ranking-table td {
        padding: 8px 6px;
        font-size: 0.8rem;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      .links a {
        font-size: 0.65rem;
        padding: 2px 6px;
      }
      
      .modal {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏆 FiNANCiE オーナーランキング</h1>
      <p class="updated">最終更新: <span id="lastUpdated">-</span></p>
    </header>
    
    <table class="ranking-table">
      <thead>
        <tr>
          <th>順位</th>
          <th>コミュニティ</th>
          <th>サポーター数</th>
          <th>週間投稿</th>
          <th>最終投稿</th>
        </tr>
      </thead>
      <tbody id="rankingBody">
        <tr><td colspan="5" style="text-align:center;">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
  
  <!-- モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">サポーター推移</span>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="period-buttons">
        <button class="period-btn active" data-period="1W">1W</button>
        <button class="period-btn" data-period="1M">1M</button>
        <button class="period-btn" data-period="1Y">1Y</button>
        <button class="period-btn" data-period="ALL">ALL</button>
      </div>
      <div class="chart-container">
        <canvas id="supporterChart"></canvas>
      </div>
      <div class="no-data" id="noData" style="display:none;">
        データがありません
      </div>
    </div>
  </div>
  
  <script>
    let rankingData = null;
    let currentChart = null;
    let currentName = null;
    
    async function loadRanking() {
      try {
        const response = await fetch('data/ranking.json');
        rankingData = await response.json();
        
        document.getElementById('lastUpdated').textContent = rankingData.updated || '-';
        
        const tbody = document.getElementById('rankingBody');
        tbody.innerHTML = rankingData.ranking.map((item, i) => {
          const financieLink = item.financieUrl 
            ? `<a href="${item.financieUrl}" target="_blank" class="link-financie">FiNANCiE</a>` 
            : '';
          const xLink = item.xId 
            ? `<a href="https://x.com/${item.xId.replace('@', '')}" target="_blank" class="link-x">𝕏</a>` 
            : '';
          const chartLink = `<a class="link-chart" onclick="openChart('${item.name.replace(/'/g, "\\'")}')">📈推移</a>`;
          
          return `
            <tr>
              <td class="rank ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</td>
              <td class="name-cell">
                <div class="community-name">${item.name}</div>
                <div class="links">${financieLink}${xLink}${chartLink}</div>
              </td>
              <td class="supporters">${item.supporters.toLocaleString()}</td>
              <td class="weekly">${item.weeklyPosts}</td>
              <td>${item.lastPost || '-'}</td>
            </tr>
          `;
        }).join('');
        
      } catch (error) {
        console.error('データの読み込みに失敗:', error);
        document.getElementById('rankingBody').innerHTML = 
          '<tr><td colspan="5" style="text-align:center;color:#ff6b6b;">データの読み込みに失敗しました</td></tr>';
      }
    }
    
    function openChart(name) {
      currentName = name;
      document.getElementById('modalTitle').textContent = name + ' - サポーター推移';
      document.getElementById('modalOverlay').classList.add('active');
      
      // デフォルトは1W
      document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector('.period-btn[data-period="1W"]').classList.add('active');
      
      renderChart('1W');
    }
    
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      if (currentChart) {
        currentChart.destroy();
        currentChart = null;
      }
    }
    
    function filterDataByPeriod(data, period) {
      if (!data || data.length === 0) return [];
      
      const now = new Date();
      let cutoff;
      
      switch (period) {
        case '1W':
          cutoff = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          break;
        case '1M':
          cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
          break;
        case '1Y':
          cutoff = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
          break;
        case 'ALL':
        default:
          return data;
      }
      
      return data.filter(d => new Date(d.date) >= cutoff);
    }
    
    function renderChart(period) {
      const history = rankingData.history[currentName];
      const filteredData = filterDataByPeriod(history, period);
      
      const canvas = document.getElementById('supporterChart');
      const noData = document.getElementById('noData');
      
      if (currentChart) {
        currentChart.destroy();
      }
      
      if (!filteredData || filteredData.length === 0) {
        canvas.style.display = 'none';
        noData.style.display = 'block';
        return;
      }
      
      canvas.style.display = 'block';
      noData.style.display = 'none';
      
      const labels = filteredData.map(d => {
        const date = new Date(d.date);
        return `${date.getMonth() + 1}/${date.getDate()}`;
      });
      const values = filteredData.map(d => d.supporters);
      
      currentChart = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'サポーター数',
            data: values,
            borderColor: '#00d4ff',
            backgroundColor: 'rgba(0, 212, 255, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: filteredData.length > 30 ? 0 : 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.parsed.y.toLocaleString() + ' 人';
                }
              }
            }
          },
          scales: {
            x: {
              grid: {
                color: 'rgba(255, 255, 255, 0.1)'
              },
              ticks: {
                color: '#888',
                maxTicksLimit: 10
              }
            },
            y: {
              grid: {
                color: 'rgba(255, 255, 255, 0.1)'
              },
              ticks: {
                color: '#888',
                callback: function(value) {
                  return value.toLocaleString();
                }
              }
            }
          }
        }
      });
    }
    
    // イベントリスナー
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    
    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderChart(this.dataset.period);
      });
    });
    
    // 初期化
    loadRanking();
  </script>
</body>
</html>
